<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>minty — Scramjet Space Proxy</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ff66;
            --matrix-green: #10b981;
            --space-bg: #030507;
            --space-card: rgba(8, 14, 11, 0.9);
            --space-border: rgba(0, 255, 102, 0.25);
            --text-main: #e2fcef;
            --text-muted: #6b8c7a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: var(--space-bg);
            color: var(--text-main);
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 255, 102, 0.05) 0%, transparent 70%);
        }

        header {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 14px 28px;
            background: var(--space-card);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--space-border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
        }

        .brand {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .brand-logo {
            height: 38px;
            width: auto;
            filter: drop-shadow(0 0 8px rgba(0, 255, 102, 0.5));
            transition: transform 0.2s ease;
        }

        .brand-logo:hover {
            transform: scale(1.03);
        }

        .search-box {
            flex: 1;
            display: flex;
            align-items: center;
            background: rgba(2, 6, 4, 0.95);
            border: 1px solid var(--space-border);
            border-radius: 12px;
            padding: 4px 6px 4px 18px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search-box:focus-within {
            border-color: var(--neon-green);
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.25), inset 0 2px 4px rgba(0, 0, 0, 0.6);
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 500;
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .search-box button {
            padding: 9px 22px;
            background: linear-gradient(135deg, var(--matrix-green), var(--neon-green));
            color: #020804;
            border: none;
            border-radius: 8px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.35);
            transition: all 0.2s ease;
        }

        .search-box button:hover {
            filter: brightness(1.1);
            box-shadow: 0 0 18px rgba(0, 255, 102, 0.6);
            transform: translateY(-1px);
        }

        main { flex: 1; width: 100%; background: #000; position: relative; }
        #viewer { width: 100%; height: 100%; border: none; background: #000; }

        footer {
            display: flex;
            justify-content: space-between;
            padding: 10px 24px;
            background: var(--space-card);
            border-top: 1px solid var(--space-border);
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="brand">
            <img src="logo.png" alt="minty" class="brand-logo">
        </a>
        <div class="search-box">
            <input type="url" id="urlInput" placeholder="Enter URL or search query (e.g. https://youtube.com)" value="https://youtube.com">
            <button onclick="launchProxy()">Launch 🚀</button>
        </div>
    </header>

    <main>
        <iframe id="viewer"></iframe>
    </main>

    <footer>
        <div>Engine: Scramjet WASM Core</div>
        <div>minty v3.0 // secure space network</div>
    </footer>

    <script>
        async function launchProxy() {
            let input = document.getElementById('urlInput').value.trim();
            const iframe = document.getElementById('viewer');

            if (!input) return;

            let targetUrl = input;
            if (!input.startsWith('http://') && !input.startsWith('https://')) {
                if (input.includes('.') && !input.includes(' ')) {
                    targetUrl = 'https://' + input;
                } else {
                    targetUrl = 'https://www.google.com/search?q=' + encodeURIComponent(input);
                }
            }

            try {
                if (!navigator.serviceWorker) {
                    alert("Service workers are not supported.");
                    return;
                }

                // Register root service worker
                const registration = await navigator.serviceWorker.register('/scramjet.sw.js', {
                    scope: '/'
                });

                await navigator.serviceWorker.ready;

                // Route through the Scramjet prefix
                iframe.src = '/scram/' + encodeURIComponent(targetUrl);
            } catch (err) {
                console.error("Scramjet launch error:", err);
                alert("Error launching proxy: " + err.message);
            }
        }
    </script>
</body>
</html>
