    * {

    .rotate {
      transform: rotate(90deg);
      transform-origin: 28.13% 50%;

    .spinner {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: conic-gradient(rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.0), rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 1));
      mask-image: radial-gradient(circle, rgba(0, 0, 0, 0) 58%, rgba(0, 0, 0, 1) 59%);
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }

    .input-div {
    height: 3rem;
    position: fixed;
    width: 600px;
    right: 0;
    left: 0;
    margin: auto;
    pointer-events: auto;
    z-index: 99998;
    /*overflow: hidden;*/
}


.input-div:focus-within::before {
    content: '';
    position: absolute;
    top: -2px;
    left: -2px;
    width: calc(100% + 4px);
    height: calc(100% + 4px);
    border-radius: 1.5rem;
    background: linear-gradient(90deg, #9ff2c7, #ffffff, #9ff2c7);
    background-size: 200% 100%;
    animation: borderMarquee 1.5s linear 1.5s;
    pointer-events: none;
    z-index: 1;
    opacity: 0.5;
}

@keyframes borderMarquee {
    0% {
        background-position: 200% 0;
    }
    100% {
        background-position: -200% 0;
    }
}

.input-div_input {
    display: block;
    width: 100%;
    height: 100%;
    outline: none;
    border-radius: 1.5rem;
    padding: 0 6rem 0 1.5rem;
    font-size: 1.4rem;
    box-sizing: border-box;
    position: relative;
    background: #fff;
    z-index: 2;
    opacity: 0.7;
}

.input-div_div {
    position: absolute;

    .keyboard {
      position: fixed;
      z-index: 1000;
      pointer-events: none;
      background-color: transparent;
      margin: auto;
    }

    .keyboard-key {
      position: absolute;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      cursor: pointer;
      user-select: none;
      pointer-events: auto;
      text-align: center;
      opacity: 0.3;
      /* 默认半透明，减少画面遮挡 */
      transition: opacity 0.2s, transform 0.1s, box-shadow 0.2s;
    }

    /* 按下状态：瞬间高亮并带有紫色霓虹发光 */
    .keyboard-key:active,
    .keyboard-key-press {
      opacity: 0.9 !important;
      transform: scale(0.92);
      box-shadow: 0 0 15px rgba(159, 242, 199, 0.8);
      border-color: rgba(159, 242, 199, 0.5) !important;
    }
    /* small 键靠 translate(-50%,50%) 锚定坐标，active 必须带上否则按键向右上跳变 */
    .keyboard-key.keyboard-key-small:active,
    .keyboard-key.keyboard-key-small.keyboard-key-press {
      transform: translate(-50%, 50%) scale(0.92);
    }

    .keyboard-key-text.editing {
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
      animation: pulse-glow 2s infinite ease-in-out;
    }

    @keyframes pulse-glow {
      0% {
        opacity: 0.6;
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: 0.6;
      }
    }

    .keyboard-no-pointer {
      pointer-events: none;
    }

    .keyboard-key {
      position: absolute;
      backdrop-filter: blur(2px);
      font-size: 0.6rem;
      color: #ffffff;
      user-select: none;
      touch-action: none;
      transition: transform 0.08s, box-shadow 0.08s;
    }

    .keyboard-key-remove {
      position: absolute;
      height: 16px;
      width: 16px;
      color: #fff;
      background: rgba(252, 74, 94, 0.9);
      font-size: 12px;
      line-height: 16px;
      top: -16px;
      right: -16px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      cursor: pointer;
      z-index: 1;
    }

    .keyboard-key-text {
      cursor: grab;
      background: linear-gradient(to top, rgba(92, 109, 130, 0.7), rgba(60, 70, 81, 0.7));
      border-radius: 50%;
    }

    .keyboard-key-text.dragging {
      cursor: grabbing;
      background: rgba(255, 255, 255, 0.9);
      color: #0a211b;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
      z-index: 9999;
    }

    .keyboard-key-small {
      transform: translate(-50%, 50%);
      border-radius: 50%;

    .keyboard-key-large {

    .keyboard-key-press {

    @keyframes blink-scale {
      0% {
        background-color: #2a8a68;
        transform: scale(1);
      }

      25% {
        background-color: #9ff2c7;
        transform: scale(1.5);
      }

        background-color: #2a8a68;
        transform: scale(1);
      }

      75% {

      100% {

      }
